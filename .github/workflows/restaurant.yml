name: Restaurant Reservation CI

on:
  push:
  workflow_dispatch:

jobs:
  test-restaurant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run restaurant unit tests
        run: python -m unittest -v